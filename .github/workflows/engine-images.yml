# Ready-made images of the two programs beside the yue2.cpp engine on Docker, so a user downloads them rather than
# compiling them, which takes the better part of an hour: yue2.cpp's server (engine-cpp/) and stable-diffusion.cpp's
# picture server (engine-pictures/), each built from its folder exactly as `docker compose build` would, for every
# NVIDIA generation the engine supports.
#
# Each is published to ghcr.io/yeufonic/<name>:<tag>, the tag a hash of its folder (scripts/engine-image-tag.sh),
# which compose.cpp.yml names; an image whose tag is already published is not built again.  Each carries a build
# provenance attestation, which `gh attestation verify oci://ghcr.io/yeufonic/<name>:<tag> --owner yeufonic` checks.
name: Engine images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/cpp-*'
    paths:
      - 'engine-cpp/**'
      - 'engine-pictures/**'
      - 'scripts/engine-image-tag.sh'
      - '.github/workflows/engine-images.yml'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: engine-cpp
            name: yeufonic-engine-cpp
          - folder: engine-pictures
            name: yeufonic-pictures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Its tag, and whether it is published
        id: tag
        run: |
          tag=$(sh scripts/engine-image-tag.sh "${{ matrix.folder }}")
          image="ghcr.io/yeufonic/${{ matrix.name }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
            echo "$image:$tag is already published: nothing to build"
          else
            echo "built=no" >> "$GITHUB_OUTPUT"
            echo "building $image:$tag"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The CUDA development image and the build need more room than the machine has free.
      - name: Room to build
        if: steps.tag.outputs.built == 'no'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        if: steps.tag.outputs.built == 'no'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: steps.tag.outputs.built == 'no'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        if: steps.tag.outputs.built == 'no'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.folder }}
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          # The generations CUDA 13 builds for that a desktop card has: RTX 20 (7.5), A100 (8.0), RTX 30 (8.6),
          # RTX 40 (8.9) and RTX 50 (12.0), with portable code for 12.0 so a later card still runs it.
          build-args: |
            CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;120-real;120-virtual
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Built from ${{ matrix.folder }}/ of Yeufonic for its yue2.cpp engine

      - name: Attest the build
        if: steps.tag.outputs.built == 'no'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
