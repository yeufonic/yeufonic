<!doctype html>
<!-- The README screenshots, one scene per #hash, over the demo library
     (tools/demo-library.py).  Copied into app/static for the run, since it drives the
     app in a same-origin frame, and removed afterwards.  Headless Chrome shoots it:

       chrome --headless --hide-scrollbars --force-device-scale-factor=2 \
         --window-size=1900,1500 --virtual-time-budget=9000 \
         --screenshot=cover.png http://<app>/static/readme-shots.html#cover

     Scenes: cover (the editor's Score page), comfy (Wide + Comfy, the take panel), light (Light theme),
     song (the editor), instrumental, lora (the editor with a style LoRA), corpora, corpus,
     mastering (the rack on its own, floating at 30,24: the shot is cropped to it; it reports the
     rack's box to /__r, which the app's log shows, for the crop), playlists (the playlists view). -->
<html><body style="margin:0;background:#08080b">
<iframe id="f" style="width:100vw;height:100vh;border:0;display:block"></iframe>
<script>
var scene = location.hash.slice(1);
var f = document.getElementById('f');
try {   // the app reads these on load: every scene starts from the same place
  localStorage.setItem('yue2.space', 'demo00000001');
  localStorage.setItem('yue2.layout', (scene === 'comfy' || scene === 'light') ? 'comfy' : 'compact');
  localStorage.setItem('yue2.theme', scene === 'light' ? 'light' : 'dark');
  localStorage.setItem('yue2.width', 'wide');
  localStorage.setItem('yue2.filter', 'all');
  localStorage.setItem('yue2.sheet', 'open');
  if (scene === 'mastering') { localStorage.setItem('yue2.peqRange', '6'); }   // small moves, seen large
} catch (e) {}
f.onload = function () {
  var w = f.contentWindow, d = w.document;
  var calm = d.createElement('style');
  calm.textContent = '*{animation:none!important;transition:none!important;caret-color:transparent!important}';
  d.head.appendChild(calm);
  function take(id) { return w.State.takes.filter(function (t) { return t.id === id; })[0]; }
  function when(test, then, n) { n = n || 0; if (test() || n > 80) { then(); } else { setTimeout(function () { when(test, then, n + 1); }, 100); } }
  when(function () { return w.State && w.State.takes && w.State.takes.length && w.State.settings && Object.keys(w.State.settings).length; }, function () {
    // Every scene but Corpora shows the take panel, beside the editor window or on its own.
    if (scene === 'light') {
      // The theme is a setting the page reads again on every poll of the settings: held light here.
      var setting = w.setting;
      w.setting = function (key, fallback) { return key === 'appearance.theme' ? 'light' : setting(key, fallback); };
      w.applyTheme();
      w.selectTake(take('glasshouse00'));
    } else if (scene === 'cover') {
      w.selectTake(take('paperboats00')); w.openEditor('score');
      setTimeout(function () { var chart = d.getElementById('chord-chart'); if (chart && chart.textContent !== 'Hide chart') { chart.click(); } }, 400);
    } else if (scene === 'comfy') {
      w.selectTake(take('glasshouse00'));
    } else if (scene === 'song') {
      w.selectTake(take('glasshousewi')); w.openEditor('song');
    } else if (scene === 'instrumental') {
      // A new one being set up, so the section builder shows rather than a plan.
      w.confirm = function () { return true; };
      w.selectTake(take('glasshouse00'));
      w.newTake('inst');
      setTimeout(function () {
        d.getElementById('title').value = 'Copper Wire';
        d.getElementById('style').value = 'downtempo, electric piano, upright bass, brushed drums, 88 BPM';
        var harmony = d.getElementById('harmony'); harmony.value = 2; harmony.dispatchEvent(new w.Event('input', { bubbles: true }));
        w.STRUCTURE.kind = 'sections'; w.paintStructure(); w.paintEditor();
      }, 400);
    } else if (scene === 'lora') {
      w.selectTake(take('glasshouse00')); w.openEditor('sound');
    } else if (scene === 'playlists') {
      w.switchView('playlists');
    } else if (scene === 'mastering') {
      // The rack on its own, every unit in, with a take playing through it.
      var song = take('glasshouse00'), R = w.Rack, E = w.RackEngine, panel = d.getElementById('rack-panel');
      w.selectTake(song); w.playTake(song.id); R.openForTake(song);
      // The rack reads the settings kept with the take as it opens, and that answer comes back a moment
      // later: the scene is set once it has, or it would be set and then put back to flat.
      setTimeout(function () {
        var preset = d.getElementById('rack-preset-select');
        preset.value = 'radio_master'; preset.dispatchEvent(new w.Event('change'));
        [[0, 'freq', 32], [1, 'gain', 1.5], [2, 'freq', 280], [2, 'q', 1.4], [2, 'gain', -2.5], [3, 'freq', 1800], [3, 'gain', 1.2],
         [4, 'freq', 4200], [4, 'q', 1.3], [4, 'gain', 2], [5, 'gain', 2.5]].forEach(function (set) { R.peqSet(set[0], set[1], set[2]); });
        R.peqBand = 2; R.peqChanged(true);
        R.floatToCenter();
        panel.style.left = '30px'; panel.style.top = '24px';
        // nothing but the rack: the shot is cropped to it, and its corners and shadow want a plain page behind
        var alone = d.createElement('style'); alone.textContent = 'body > *:not(#rack-panel){visibility:hidden!important}'; d.head.appendChild(alone);
        // A shot stops the clock, so nothing is really playing and the analyser behind the equaliser's curve has
        // heard nothing.  The spectrum drawn is the take's own all the same: a few seconds of it are rendered here
        // through the rack as it is set, and the screen is given what that render's analyser heard.
        w.fetch('/api/takes/' + song.id + '/audio').then(function (r) { return r.arrayBuffer(); }).then(function (bytes) {
          return new w.OfflineAudioContext(2, 1, 48000).decodeAudioData(bytes);
        }).then(function (whole) {
          var ctx = new w.OfflineAudioContext(2, 3 * whole.sampleRate, whole.sampleRate), source = ctx.createBufferSource();
          var chain = Object.create(E), entry = ctx.createGain(), out = ctx.createGain();
          chain.ctx = ctx; chain.build(ctx, entry, out); chain.applySettings(R.settings, true);
          source.buffer = whole; source.connect(entry); out.connect(ctx.destination); source.start(0, 62, 3);
          return ctx.startRendering().then(function () {
            var heard = new Float32Array(chain.spectrum.frequencyBinCount);
            chain.spectrum.getFloatFrequencyData(heard);
            E.spectrum = { staged: true, frequencyBinCount: heard.length, getFloatFrequencyData: function (into) { into.set(heard); } };
            Object.defineProperty(d.getElementById('audio'), 'paused', { get: function () { return false; } });
            R.drawPeq();
          });
        }).catch(function () { /* the shot goes without a spectrum */ }).then(function () {
          var box = panel.getBoundingClientRect();
          w.fetch('/__r?' + encodeURIComponent(JSON.stringify({ rack: [box.left, box.top, box.width, box.height].map(Math.round), zoom: R.rackZoom,
                                                                 preset: d.getElementById('rack-preset-select').value, spectrum: Boolean(E.spectrum && E.spectrum.staged) })));
        });
      }, 900);
    } else if (scene === 'corpora' || scene === 'corpus') {
      w.State.options.training_available = true;   // the trainer is in the engine; say so without waiting on it
      w.openIdentities(); if (scene === 'corpus') { w.showIdentity('glassorchard'); }
    }
  });
};
// Only now: the app reads the choices above as it loads, so it must not start before them.
f.src = '/';
</script></body></html>
