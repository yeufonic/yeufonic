# The yue2.cpp engine in place of ComfyUI: for GPUs with less memory.  It renders, plans and
# transcribes; training needs the ComfyUI engine, and the app leaves it out.  Gemma, for lyric
# drafts and picture descriptions on this PC, runs beside it in Ollama when chosen (the gemma
# service), and FLUX.2 klein, for take pictures, in stable-diffusion.cpp's server (pictures).
#
# Chosen in .env, read by every docker compose command:
#   COMPOSE_FILE=compose.yml:compose.cpp.yml
#   COMPOSE_PROFILES=gemma,pictures     (with Gemma, with pictures drawn here: either or both)
# and its models fetched with scripts/fetch-models.sh --cpp [--gemma] [--pictures].  Take the lines out to go back.
services:
  # Not started: the profile is never asked for.
  engine:
    profiles: ["comfyui"]

  engine-cpp:
    build:
      context: ./engine-cpp
      args:
        # Empty builds for every recent NVIDIA card; one architecture (89-real for an RTX 40,
        # 86-real for an RTX 30) builds much faster.
        CUDA_ARCHITECTURES: "${YUE2CPP_CUDA_ARCH:-}"
    image: yeufonic-engine-cpp:latest
    container_name: yeufonic-engine-cpp
    restart: unless-stopped
    # The backbone: Q8_0 (near lossless) by default; YUE2CPP_MODEL picks another,
    # such as YuE2-3B-BF16.gguf, or YuE2-3B-Q6_K.gguf for a smaller card.
    command:
      - --model
      - /models/${YUE2CPP_MODEL:-YuE2-3B-Q8_0.gguf}
      - --vae
      - /models/YuE2-Vae-F32.gguf
      - --transcriber
      - /models/SheetSage2-Q8_0.gguf
      - --adapters
      - /adapters
    # Localhost only, for debugging: its own page is a plain test bench.
    ports:
      - "127.0.0.1:8189:8087"
    volumes:
      - ./models/yue2cpp:/models:ro
      - ./models/loras:/adapters:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Gemma 4 E4B in Ollama: started only with the gemma profile.  It unloads the model as soon as
  # it has answered (OLLAMA_KEEP_ALIVE=0), so it never holds video memory a render needs.
  gemma:
    image: ollama/ollama:0.40.13
    profiles: ["gemma"]
    container_name: yeufonic-gemma
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ./models/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # FLUX.2 klein in stable-diffusion.cpp's server: started only with the pictures profile.  It reads
  # the models folder as ComfyUI's layout (diffusion_models/, text_encoders/, vae/); the app loads klein
  # for each picture and unloads it after, so it holds no video memory between pictures.
  pictures:
    build:
      context: ./engine-pictures
      args:
        CUDA_ARCHITECTURES: "${YUE2CPP_CUDA_ARCH:-}"
    image: yeufonic-pictures:latest
    profiles: ["pictures"]
    container_name: yeufonic-pictures
    restart: unless-stopped
    command: ["--model-dir", "/models"]
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    depends_on: !override
      - engine-cpp
    environment:
      ENGINE_URL: http://engine-cpp:8087
      ENGINE_KIND: yue2cpp
      # Asked whether it is there; without the gemma profile it is not, and Gemma's features are off.
      GEMMA_URL: http://gemma:11434
      GEMMA_MODEL: "${GEMMA_MODEL:-gemma4:e4b-it-qat}"
      PICTURES_URL: http://pictures:8088
