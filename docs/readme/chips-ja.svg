<svg xmlns="http://www.w3.org/2000/svg" width="478" height="94" viewBox="0 0 478 94">
  <!-- Yeufonic's feature chips, drawn as the header fields of a score (ABC), which the app writes and edits. -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff4d94"/></linearGradient></defs>
  <g transform="translate(2.0 2)"><rect width="231.0" height="40" rx="20.0" fill="#17121f" stroke="url(#g)" stroke-opacity="0.7" stroke-width="1.5"/><rect x="4" y="4" width="36" height="32" rx="16.0" fill="url(#g)"/><text x="22" y="25.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" font-weight="700" fill="#ffffff">X:</text><text x="52" y="25.5" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" fill="#e6e1f5">プロンプトから曲を</text></g><g transform="translate(245.0 2)"><rect width="231.0" height="40" rx="20.0" fill="#17121f" stroke="url(#g)" stroke-opacity="0.7" stroke-width="1.5"/><rect x="4" y="4" width="36" height="32" rx="16.0" fill="url(#g)"/><text x="22" y="25.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" font-weight="700" fill="#ffffff">T:</text><text x="52" y="25.5" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" fill="#e6e1f5">自分の録音をカバー</text></g><g transform="translate(2.0 52)"><rect width="231.0" height="40" rx="20.0" fill="#17121f" stroke="url(#g)" stroke-opacity="0.7" stroke-width="1.5"/><rect x="4" y="4" width="36" height="32" rx="16.0" fill="url(#g)"/><text x="22" y="25.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" font-weight="700" fill="#ffffff">K:</text><text x="52" y="25.5" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" fill="#e6e1f5">スタイル LoRA を学習</text></g><g transform="translate(245.0 52)"><rect width="231.0" height="40" rx="20.0" fill="#17121f" stroke="url(#g)" stroke-opacity="0.7" stroke-width="1.5"/><rect x="4" y="4" width="36" height="32" rx="16.0" fill="url(#g)"/><text x="22" y="25.5" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" font-weight="700" fill="#ffffff">Q:</text><text x="52" y="25.5" font-family="SFMono-Regular, Consolas, Menlo, ui-monospace, monospace" font-size="15" fill="#e6e1f5">ステムとマスタリング</text></g>
</svg>
